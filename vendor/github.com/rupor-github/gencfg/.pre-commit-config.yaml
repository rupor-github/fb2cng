fail_fast: true
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: check-gofmt
        name: Checking go source formatting
        language: system
        entry: bash -c "exit $(gofmt -l . | grep -v '^vendor/' | wc -l)"
        require_serial: true
        always_run: true
        stages: [pre-commit, pre-push]
      - id: check-vuln
        name: Scanning for vulnerabilities
        language: system
        entry: bash -c "go run -mod=mod golang.org/x/vuln/cmd/govulncheck@latest ./..."
        require_serial: true
        always_run: true
        stages: [pre-push]
